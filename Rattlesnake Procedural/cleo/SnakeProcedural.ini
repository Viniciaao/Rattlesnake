; Rattlesnake Procedural - configuracao
;
; Os valores podem ser editados com o jogo aberto: o script rele o arquivo a
; cada verificacao (veja CheckInterval). Nao apague as chaves: se faltar
; alguma, o script usa o valor padrao escrito no codigo.

[Settings]

; Liga/desliga o sistema. Com 0, o script para de gerar cobras e as que
; estiverem vivas sao removidas. 1 = ligado, 0 = desligado.
Enabled = 1

; Chance (em %) de tentar gerar uma cobra a cada verificacao.
; 100 = tenta sempre que houver espaco, 1 = quase nunca.
Chance = 20

; Intervalo entre verificacoes, em milissegundos. Valores menores deixam o
; jogo mais "vivo" e custam um pouco mais de CPU (minimo 500).
CheckInterval = 2000

; Numero maximo de cobras vivas ao mesmo tempo (1 a 5). O script cria uma
; thread para cada cobra possivel, entao aumentar este valor em jogo passa a
; valer a partir da proxima verificacao.
MaxSnakes = 3

; 1 = cobras podem nascer dentro dos limites das cidades (Los Santos,
; San Fierro e Las Venturas), desde que o chao seja natural.
; 0 = apenas no interior (campo, deserto, praias fora da cidade).
InCities = 1

; Quais tipos de chao podem receber uma cobra:
;   0 = somente areia, grama e terra (o minimo exigido)
;   1 = naturais: areia/grama/terra + vegetacao, bosque, rocha, campo (padrao)
;   2 = qualquer solo solido (nunca em agua)
Surfaces = 1

; 1 = evita gerar a cobra dentro do campo de visao da camera (ela aparece
; atras do jogador em vez de "surgir" na frente dele).
AvoidCameraView = 1

; Raio maximo, em metros, em volta do jogador onde a cobra pode nascer.
; O limite do mod e 40.0.
SpawnRadius = 40.0

; Distancia minima, em metros, entre a cobra e o jogador na hora de nascer.
MinDistance = 18.0

; A cobra e removida quando o jogador se afasta mais do que isso (metros).
; O limite do mod e 55.0.
DespawnDistance = 55.0

; Volume dos sons (0.0 a 1.0).
Volume = 0.6

; 1 = mostra mensagens na tela com o resultado de cada tentativa de geracao
; (tipo de chao encontrado, motivo da recusa...). Util para calibrar as
; regras; 0 = desligado.
Debug = 0
